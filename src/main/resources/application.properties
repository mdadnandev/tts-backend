```properties
# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}


# =========================================================
# TTS CONFIGURATION
# =========================================================
tts.provider=elevenlabs
tts.max-text-length=5000


# =========================================================
# ELEVENLABS
# =========================================================
tts.elevenlabs.api-key=${ELEVENLABS_API_KEY}
tts.elevenlabs.base-url=https://api.elevenlabs.io/v1
tts.elevenlabs.model-id=eleven_turbo_v2_5


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# =========================================================
# SUPABASE POSTGRESQL
# =========================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# =========================================================
# LOGGING
# =========================================================
logging.level.com.example.ttsbackend=INFO
logging.level.org.springframework.web=INFO

